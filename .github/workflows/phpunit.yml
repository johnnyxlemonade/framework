name: PHPUnit Test Suite

on:
  push:
    branches: [main, master, 'feature/**']
    paths:
      - 'src/**'
      - 'tests/**'
      - 'bin/**'
      - 'composer.json'
      - 'composer.lock'
      - 'phpunit.xml.dist'
      - 'phpunit.property.xml.dist'
      - '.github/workflows/**'

  pull_request:

  workflow_dispatch:

concurrency:
  group: phpunit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.5', '8.4', '8.3']

    env:
      DB_HOST: 127.0.0.1
      DB_NAME: framework_test
      DB_USER: framework
      DB_PASS: framework

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: framework_test
          MARIADB_USER: framework
          MARIADB_PASSWORD: framework
          MARIADB_RANDOM_ROOT_PASSWORD: '1'
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=10s

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
          extensions: fileinfo, mbstring, xmlwriter, mysqli, pdo_mysql, pdo_sqlite

      - name: Validate composer.json
        run: composer validate --strict

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php-${{ matrix.php }}-phpunit-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php-${{ matrix.php }}-phpunit-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPUnit
        env:
          DB_PORT: ${{ job.services.mariadb.ports[3306] }}
        run: composer test:ci

      - name: Run property tests
        run: composer test:property
