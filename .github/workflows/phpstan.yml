name: PHPStan Static Analysis

on:
  push:
    branches: [main, master, 'feature/**']
    paths:
      - 'src/**'
      - 'tests/**'
      - 'composer.json'
      - 'phpstan.neon.dist'
      - '.github/workflows/**'

  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'composer.json'
      - 'phpstan.neon.dist'
      - '.github/workflows/**'

  workflow_dispatch:

concurrency:
  group: phpstan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  phpstan:
    name: PHPStan (PHP 8.3)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate repository structure
        run: |
          set -euo pipefail

          if [ ! -f composer.json ]; then
            echo "::error::composer.json is missing. Repository is in invalid state."
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
          extensions: fileinfo, mbstring

      - name: Validate composer.json
        run: composer validate --strict

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php-8.3-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php-8.3-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPStan
        run: composer stan:ci
